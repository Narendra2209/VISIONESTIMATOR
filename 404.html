<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Page Not Found — Vision Estimators</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>try{if(localStorage.getItem('ve-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>

      <button class="btn-primary" onclick="history.back()">
        <i data-icon="ArrowLeftIcon" data-size="16"></i> Go Back

      <a class="btn-secondary" href="index.html">
        <i data-icon="HomeIcon" data-size="16"></i> Back to Home
      </a>
    </div>
  </div>

</html>
